<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#tealGrad)" />
  
  <!-- Warehouse & Cross Icon Group -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Base Warehouse / Building contour -->
    <path d="M40 320 L192 320 L192 240 L40 240 Z" fill="#ffffff" opacity="0.2" />
    <path d="M192 320 L344 320 L344 240 L192 240 Z" fill="#ffffff" opacity="0.3" />
    
    <!-- Medical Cross -->
    <rect x="162" y="70" width="60" height="180" rx="20" fill="#ffffff" />
    <rect x="102" y="130" width="180" height="60" rx="20" fill="#ffffff" />
    
    <!-- Capsule Pill Symbol -->
    <g transform="translate(142, 170) rotate(-45)">
      <!-- Left side of capsule -->
      <path d="M-20 -40 C-20 -62 0 -80 25 -80 C50 -80 70 -62 70 -40 L70 10 L-20 10 Z" fill="#38bdf8" />
      <!-- Right side of capsule -->
      <path d="M-20 10 L70 10 L70 60 C70 82 50 100 25 100 C0 100 -20 82 -20 60 Z" fill="#ffffff" />
      <!-- Center divider line -->
      <line x1="-20" y1="10" x2="70" y2="10" stroke="#0f766e" stroke-width="4" />
    </g>
  </g>
</svg>
